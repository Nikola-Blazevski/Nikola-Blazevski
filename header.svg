<svg xmlns="http://www.w3.org/2000/svg" width="840" height="500" viewBox="0 0 840 500">
  <style>
    text { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 16px; fill: #c9d1d9; }
    .p { fill: #81D41A; font-weight: 700; }
    .d { fill: #8b949e; }
    .n { font-size: 30px; font-weight: 700; fill: #f0f6fc; }
    .dir { fill: #58a6ff; font-weight: 700; }
    .c { fill: #81D41A; animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <!-- window -->
  <rect x="1" y="1" width="838" height="498" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <path d="M13 2 H827 A11 11 0 0 1 838 13 V37 H2 V13 A11 11 0 0 1 13 2 Z" fill="#161b22"/>
  <line x1="2" y1="37" x2="838" y2="37" stroke="#30363d" stroke-width="2"/>
  <circle cx="24" cy="19" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="19" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="19" r="6" fill="#27c93f"/>
  <text x="420" y="24" text-anchor="middle" class="d" style="font-size:13px">nikola@ualberta: ~</text>

  <!-- whoami -->
  <text x="32" y="76"><tspan class="p">$</tspan> whoami</text>
  <text x="32" y="114" class="n">nikola blazevski</text>
  <text x="32" y="142" class="d">cs + math @ university of alberta  ·  president, ucsc | ualberta</text>

  <!-- about -->
  <text x="32" y="186"><tspan class="p">$</tspan> cat about.txt</text>
  <text x="32" y="214">i run the cybersecurity club at ualberta. we build our own ctfs</text>
  <text x="32" y="238">and try to get students in the same room as people in industry.</text>
  <text x="32" y="270">i mostly write c and python, and i live in neovim. i like the</text>
  <text x="32" y="294">low-level stuff: emulators, embedded linux, anything with a sensor.</text>
  <text x="32" y="318">i also keep a linux server running at home (and keep breaking it).</text>

  <!-- interests -->
  <text x="32" y="362"><tspan class="p">$</tspan> ls ./into</text>
  <text x="32" y="390" class="dir">security/</text>
  <text x="172" y="390" class="dir">systems/</text>
  <text x="302" y="390" class="dir">embedded/</text>
  <text x="442" y="390" class="dir">homelab/</text>
  <text x="572" y="390" class="dir">ctfs/</text>

  <!-- previously -->
  <text x="32" y="426"><tspan class="p">$</tspan> cat previously.txt</text>
  <text x="32" y="454">taught c# game dev to kids @ code ninjas</text>

  <!-- prompt -->
  <text x="32" y="486"><tspan class="p">$</tspan></text>
  <rect x="52" y="471" width="10" height="19" class="c"/>
</svg>
